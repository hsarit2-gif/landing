<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>תודה! | שרית הראל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{--ink:#434343;--stone:#696663;--cream:#E7E1DA;--black:#000;--white:#fff;--rule:rgba(67,67,67,.24);
    --body:'Assistant','Heebo',Arial,sans-serif;--latin:'Oswald','Arial Narrow',sans-serif;--gutter:clamp(20px,5vw,64px);color-scheme:light;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:1.06rem;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;}
  img{display:block;max-width:100%;}
  a{color:inherit;}
  h1,p{margin:0;}
  .nav{border-bottom:1px solid var(--rule);}
  .nav .in{display:flex;align-items:center;height:62px;padding-inline:var(--gutter);}
  .lockup{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .lockup svg{width:36px;height:36px;flex:none;}
  .lockup .name{font-family:var(--latin);font-weight:300;font-size:1.05rem;letter-spacing:.18em;line-height:1;direction:ltr;}
  .lockup .name small{display:block;font-size:.54rem;letter-spacing:.3em;margin-top:5px;opacity:.75;}
  main{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);max-width:1180px;width:100%;margin-inline:auto;gap:clamp(28px,5vw,80px);align-items:center;padding:clamp(40px,7vw,96px) var(--gutter);}
  figure{margin:0;}
  figure img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;}
  .kicker{font-family:var(--latin);font-weight:300;letter-spacing:.2em;text-transform:uppercase;direction:ltr;text-align:right;font-size:.9rem;color:var(--stone);margin-bottom:18px;}
  h1{font-weight:800;font-size:clamp(2.4rem,5vw,3.8rem);line-height:1.08;letter-spacing:-.01em;color:var(--black);margin-bottom:22px;}
  .lede{font-size:clamp(1.15rem,1.8vw,1.4rem);line-height:1.55;margin-bottom:28px;max-width:34ch;}
  .next{border-top:1px solid var(--rule);padding-top:22px;margin-bottom:32px;}
  .next p{margin-bottom:6px;}
  .btns{display:flex;flex-wrap:wrap;gap:12px;}
  .btn{display:inline-flex;align-items:center;gap:12px;font-weight:700;font-size:1.02rem;text-decoration:none;padding:16px 30px;border:1.5px solid var(--black);background:var(--black);color:var(--cream);transition:background .2s,color .2s;}
  .btn:hover{background:transparent;color:var(--black);}
  .btn.ghost{background:transparent;color:var(--black);}
  .btn.ghost:hover{background:var(--black);color:var(--cream);}
  .sign{font-weight:600;font-size:1.25rem;line-height:1.4;margin-top:34px;}
  :focus-visible{outline:2px solid currentColor;outline-offset:3px;}
  @media (max-width:820px){
    main{grid-template-columns:minmax(0,1fr);padding-top:28px;}
    figure{order:2;}
    figure img{aspect-ratio:1/1;}
    .btn{flex:1 1 100%;justify-content:center;}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sh-mark" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#434343"/>
    <g fill="none" stroke="#E7E1DA" stroke-width="1.7">
      <path d="M49.7 20V73.4"/><path d="M49.7 20A18 18 0 0 0 49.7 56"/><path d="M49.7 56H67.7"/>
      <path d="M67.7 20.2V73.3"/><path d="M49.7 56A8.7 8.7 0 0 1 49.7 73.4"/><path d="M49.3 80H68.3"/>
    </g>
  </symbol>
</svg>

<header class="nav"><div class="in">
  <a class="lockup" href="./" aria-label="Sarit Harel">
    <svg viewBox="0 0 100 100"><use href="#sh-mark"/></svg>
    <span class="name">SARIT HAREL<small>ARCHITECTURE &amp; DESIGN</small></span>
  </a>
</div></header>

<main>
  <div>
    <p class="kicker">Thank you</p>
    <h1>תודה! קיבלתי את הפרטים.</h1>
    <p class="lede">אני כבר מחכה לשמוע על הבית שלכם. אחזור אליכם בהקדם כדי לתאם את פגישת "שרית, מה את אומרת?".</p>
    <div class="next">
      <p><b>מה עכשיו?</b></p>
      <p>בינתיים אפשר להציץ בפרויקטים ובטיפים שלי באינסטגרם.</p>
    </div>
    <div class="btns">
      <a class="btn" href="https://www.instagram.com/sarit_harel/" target="_blank" rel="noopener">לאינסטגרם שלי ←</a>
      <a class="btn ghost" href="https://www.saritharel.online/" target="_blank" rel="noopener">לאתר שלי</a>
    </div>
    <p class="sign">נתראה בקרוב,<br>שרית</p>
  </div>
  <figure><img src="fd-assets/me-1462.jpg" alt="שרית הראל בסטודיו"></figure>
</main>
</body>
</html>
